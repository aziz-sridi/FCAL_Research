project: fcal_research
run_id: acdc-pilot/resnet50-ce-seed42
seed: 42
device: cuda
method: ce
data:
  dataset: acdc
  cardiac_root: ../datasets/ACDC-MICCAI17-prepared
  split_dir: ../datasets/ACDC-MICCAI17-prepared/splits
  image_size: 224
  resize_size: 224
  batch_size: 32
  accumulation_steps: 1
  num_workers: 4
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 5
training:
  epochs: 12
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: true
fcal:
  warmup_epochs: 5
  alpha: 0.15
  lambda_min: 0.05
  lambda_max: 0.30
  dilation_cells: 1
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 3
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.05
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 16
  epsilon: 1.0e-8
output_root: outputs
