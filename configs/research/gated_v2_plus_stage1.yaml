        maximum: 0.2562138342857361
  competition_metrics:
    - clean_accuracy
    - background_probe_accuracy
    - foreground_only_accuracy
    - strict_leakage
  minimum_strict_wins:
    CE: 3
    CAMAL: 2
    GAIN-ext: 3
    RRR: 4
    Faster-ISNet: 4
