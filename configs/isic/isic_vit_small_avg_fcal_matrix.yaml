project: fcal_research
run_id: isic/vit-small-p16-avg-ce-seed42
seed: 42
device: cuda
method: ce
data:
  dataset: isic
  isic_root: ../datasets/ISIC/Skin cancer ISIC The International Skin Imaging Collaboration
  segmentation_root: ../datasets/ISIC/fcal_v1_v5_masks
  split_dir: splits/isic_skin_seed42_grouped
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: vit
  name: vit_small_patch16_224
  pretrained_id: vit_small_patch16_224.augreg_in21k_ft_in1k
  pool: avg
  fc_norm: false
  num_classes: 8
training:
  epochs: 50
  learning_rate: 0.00005
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: false
  fused_adamw: true
  save_epoch5_branch: true
fcal:
  warmup_epochs: 5
  alpha: 0.50
  lambda_min: 0.05
  lambda_max: 1.00
  dilation_cells: 3
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 5
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.05
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 24
  epsilon: 1.0e-8
output_root: outputs
