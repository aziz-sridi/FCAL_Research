project: fcal_research
run_id: isic_ufcal_tuning/resnet50-auto-safe-seed42
seed: 42
device: cuda
method: ufcal
data:
  dataset: isic
  isic_root: ../datasets/ISIC/Skin cancer ISIC The International Skin Imaging Collaboration
  segmentation_root: ../datasets/ISIC/fcal_v1_v5_masks
  split_dir: splits/isic_skin_seed42_grouped
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 8
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: false
ufcal:
  mode: combined
  warmup_epochs: 5
  ramp_epochs: 5
  calibration_batches: 8
  outside_reduction_fraction: 0.25
  minimum_allowed_outside: 0.02
  maximum_allowed_outside: 0.80
  coverage_improvement: 0.10
  minimum_target_coverage: 0.05
  maximum_target_coverage: 0.60
  evidence_threshold: 2.0
  coverage_temperature: 0.25
  confidence_gamma: 1.0
  support_mix: 0.50
  target_gradient_ratio: 0.025
  lambda_max: 1000.0
  tolerance_cell_fraction: 0.50
  minimum_tolerance_pixels: 0
  maximum_tolerance_fraction: 0.10
  minimum_foreground_cells: 1.0
  minimum_background_cells: 1.0
  gradient_safe: true
  project_conflicts: true
  epsilon: 1.0e-8
  automatic:
    enabled: true
    initial_gradient_ratio: 0.025
    minimum_gradient_ratio: 0.005
    maximum_gradient_ratio: 0.10
    increase_factor: 1.25
    decrease_factor: 0.50
    patience: 2
    cooldown: 1
    accuracy_drop_tolerance: 0.005
    localization_plateau_tolerance: 0.001
    minimum_localization_loss: 1.0e-5
    release_start_epoch: 35
    release_end_epoch: 45
output_root: outputs
