project: fcal_research
run_id: resnet50-fcal-v4-pure-seed42
seed: 42
device: cuda
method: fcal_v4
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: false
fcal:
  warmup_epochs: 5
  alpha: 0.20
  lambda_min: 0.075
  lambda_max: 0.40
  dilation_cells: 3
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 5
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.075
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 24
  epsilon: 1.0e-8
fcal_v4:
  strict_containment_weight: 0.025
  mask_alignment_weight: 0.020
  alignment_temperature: 1.0
  alignment_mode: rms_tanh
  regional_dominance_weight: 0.0
  regional_dominance_margin: 0.6
  regional_dominance_power: 2.0
  background_sensitivity_weight: 0.005
  sensitivity_power: 1.0
  intervention:
    enabled: false
    counterfactual_ce_weight: 0.25
    prediction_consistency_weight: 0.05
    evidence_consistency_weight: 0.025
    prediction_temperature: 2.0
    evidence_consistency_temperature: 1.0
    boundary_guard_pixels: 4
    foreground_intervention_fraction: 0.50
    foreground_noise_scale: 0.20
output_root: outputs
