project: fcal_research
run_id: baseline-fixed/cub/resnet50-isnet-seed42
seed: 42
device: cuda
method: isnet
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: 'off'
  channels_last: false
  fused_adamw: false
  save_epoch5_branch: false
fcal:
  warmup_epochs: 5
  alpha: 0.15
  lambda_min: 0.05
  lambda_max: 0.3
  dilation_cells: 3
  epsilon: 1.0e-08
output_root: outputs
isnet:
  variant: selective-lrp-flex
  lrp_epsilon: 0.01
  selective_epsilon: 0.01
  heatmap_weight: 0.7
  cut_low: 1.0
  cut_high: 25.0
  background_decay: 0.0
  background_scale: 1.0
  background_weight: 1.0
  foreground_weight: 1.0
  z_b_input_rule: false
  sanitize_nonfinite_gradients: false
  epsilon: 1.0e-10
