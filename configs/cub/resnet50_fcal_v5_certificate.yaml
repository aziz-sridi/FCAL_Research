project: fcal_research
run_id: resnet50-fcal-v5-certificate-smooth-seed42
seed: 42
device: cuda
method: fcal_v5_cheap
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: false
fcal_v5_cheap:
  warmup_epochs: 5
  ramp_epochs: 5
  coefficient: 0.05
  top_k_competitors: 2
  foreground_temperature: 0.50
  background_temperature: 0.50
  background_scale: 0.50
  margin: 0.0
  temperature: 0.25
  epsilon: 1.0e-8
output_root: outputs
