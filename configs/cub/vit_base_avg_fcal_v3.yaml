project: fcal_research
run_id: vit-base-p16-avg-fcal-v3-seed42
seed: 42
device: cuda
method: fcal_v3
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: vit
  name: vit_base_patch16_224
  pretrained_id: vit_base_patch16_224.augreg_in21k_ft_in1k
  pool: avg
  fc_norm: false
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.00005
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: false
  fused_adamw: true
  save_epoch5_branch: false
fcal:
  warmup_epochs: 5
  alpha: 0.50
  lambda_min: 0.05
  lambda_max: 1.00
  dilation_cells: 3
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 5
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.05
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 24
  epsilon: 1.0e-8
fcal_v3:
  counterfactual_ce_weight: 0.50
  prediction_consistency_weight: 0.10
  evidence_consistency_weight: 0.05
  prediction_temperature: 2.0
  evidence_consistency_temperature: 1.0
  boundary_guard_pixels: 4
output_root: outputs
