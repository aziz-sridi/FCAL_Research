project: fcal_research
run_id: v2_7_prime/cub/resnet50-fcal-v2-7-prime-seed7
seed: 7
device: cuda
method: fcal_v2_7_prime
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: false
fcal:
  warmup_epochs: 5
  alpha: 0.15
  lambda_min: 0.05
  lambda_max: 0.30
  dilation_cells: 3
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 5
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.05
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 24
  epsilon: 1.0e-8
fcal_v2_next:
  seed_front_weight: 0.0
  seed_retention_weight: 0.0
  native_dominance_weight: 0.0
  foreground_region_weight: 0.0
  background_region_weight: 0.0
  adaptive_regional_weight: true
  regional_buffer_cell_fraction: 0.5
  regional_buffer_minimum_pixels: 0
  regional_buffer_maximum_pixels: 24
  acceptance_threshold: 0.35
  front_target: 0.80
  retention_target: 0.90
  evidence_temperature: 1.0
  growth_power: 2.0
  foreground_threshold: 0.50
  dominance_margin: 0.60
  dominance_power: 2.0
  foreground_logit_margin: 0.0
  maximum_background_logit_margin: 0.0
  regional_temperature: 1.0
output_root: outputs
