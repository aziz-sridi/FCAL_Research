project: fcal_research
run_id: explanation-baselines/cub/resnet50-rrr-seed7
seed: 7
device: cuda
method: rrr
data:
  cub_root: ../datasets/CUB-200-2011/versions/7/CUB_200_2011
  segmentation_root: ../datasets/CUB-200-2011/versions/7/segmentations
  split_dir: splits/cub200_2011_seed42_val0.2
  evaluation_cache: cache/cub_test_224_center
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: cnn
  name: resnet50
  pretrained_id: torchvision:resnet50:IMAGENET1K_V1
  num_classes: 200
training:
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: true
  fused_adamw: true
  save_epoch5_branch: false
fcal:
  warmup_epochs: 5
  alpha: 0.15
  lambda_min: 0.05
  lambda_max: 0.30
  dilation_cells: 3
  epsilon: 1.0e-8
rrr:
  # A 5e-5 order-matched pilot caused a 13.8 pp validation collapse after
  # two epochs. This validation-only conservative value is used for the run.
  lambda: 5.0e-6
output_root: outputs
