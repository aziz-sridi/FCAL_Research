project: fcal_research
run_id: oxford_pet/vit-base-p16-avg-ce-seed42
seed: 42
device: cuda
method: ce
data:
  dataset: oxford_pet
  pet_root: ../datasets/OxfordIIITPet/oxford-iiit-pet
  split_dir: splits/oxford_pet_seed42_val0.2
  image_size: 224
  resize_size: 256
  batch_size: 32
  accumulation_steps: 1
  num_workers: 6
model:
  family: vit
  name: vit_base_patch16_224
  pretrained_id: vit_base_patch16_224.augreg_in21k_ft_in1k
  pool: avg
  fc_norm: false
  num_classes: 37
training:
  epochs: 50
  learning_rate: 0.00005
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  grad_clip_norm: 1.0
  amp: bf16
  channels_last: false
  fused_adamw: true
  save_epoch5_branch: true
fcal:
  warmup_epochs: 5
  alpha: 0.50
  lambda_min: 0.05
  lambda_max: 1.00
  dilation_cells: 3
  epsilon: 1.0e-8
fcal_v2:
  warmup_epochs: 5
  ramp_epochs: 5
  support_temperature: 1.0
  support_margin: 0.0
  support_weight: 0.05
  tolerance_cell_fraction: 0.5
  minimum_tolerance_pixels: 0
  maximum_tolerance_pixels: 24
  epsilon: 1.0e-8
ufcal:
  mode: combined
  warmup_epochs: 5
  ramp_epochs: 5
  calibration_batches: 8
  outside_reduction_fraction: 0.25
  minimum_allowed_outside: 0.02
  maximum_allowed_outside: 0.80
  coverage_improvement: 0.10
  minimum_target_coverage: 0.05
  maximum_target_coverage: 0.60
  evidence_threshold: 2.0
  coverage_temperature: 0.25
  confidence_gamma: 1.0
  support_mix: 0.50
  target_gradient_ratio: 0.025
  lambda_max: 1000.0
  tolerance_cell_fraction: 0.50
  minimum_tolerance_pixels: 0
  maximum_tolerance_fraction: 0.10
  minimum_foreground_cells: 1.0
  minimum_background_cells: 1.0
  gradient_safe: true
  project_conflicts: true
  epsilon: 1.0e-8
  automatic:
    enabled: true
    initial_gradient_ratio: 0.025
    minimum_gradient_ratio: 0.005
    maximum_gradient_ratio: 0.10
    increase_factor: 1.25
    decrease_factor: 0.50
    patience: 2
    cooldown: 1
    accuracy_drop_tolerance: 0.005
    localization_plateau_tolerance: 0.001
    minimum_localization_loss: 1.0e-5
    release_start_epoch: 35
    release_end_epoch: 45
output_root: outputs
